<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FH Consulting | Performance Opérationnelle & Conseil IA pour PME</title>
    <meta name="description" content="Conseil et intégration d'IA pour PME & TPE. Libérez vos équipes des tâches rébarbatives sur la Compta, les RH et la Vente pour booster votre rentabilité.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1e3a8a; /* Bleu Marine Institutionnel */
            --primary-hover: #1e40af;
            --primary-light: #eff6ff;
            --accent: #0284c7; /* Cyan Business */
            --accent-green: #059669; /* Émeraude Premium */
            --accent-green-light: #ecfdf5;
            --dark: #0f172a;
            --dark-surface: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius-md: 8px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header / Navigation */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        /* Nouveau Logo IA Moderne (SVG) */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand-logo svg {
            width: 44px;
            height: 44px;
        }

        .brand-text {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.03em;
        }

        .brand-text span {
            color: var(--accent);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white) !important;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--dark);
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: var(--bg-light);
            border-color: #94a3b8;
        }

        /* Hero Section */
        .hero {
            padding: 96px 0 64px;
            text-align: center;
            background: radial-gradient(100% 100% at 50% 0%, rgba(30, 58, 138, 0.06) 0%, rgba(248, 250, 252, 0) 100%);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background-color: var(--primary-light);
            color: var(--primary);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 24px;
            border: 1px solid rgba(30, 58, 138, 0.15);
        }

        .hero h1 {
            font-size: 3.25rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.15;
            max-width: 940px;
            margin: 0 auto 24px;
            letter-spacing: -0.025em;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 760px;
            margin: 0 auto 40px;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Strategic Stats Bar */
        .stats-bar {
            margin-top: 64px;
            padding: 32px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            box-shadow: var(--shadow-sm);
        }

        .stat-item h3 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .stat-item p {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 700;
            margin-top: 4px;
        }

        .stat-item span {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            font-weight: 500;
        }

        /* Calculator Section */
        .calc-section {
            background-color: var(--white);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 80px 0;
        }

        .calc-card {
            background: var(--dark);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .calc-inputs label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .calc-inputs input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--dark-surface);
            background-color: var(--dark-surface);
            color: var(--white);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        .calc-result {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .calc-result .number {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-green);
            margin: 12px 0;
        }

        /* Section Layouts */
        .section {
            padding: 96px 0;
        }

        .section-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 64px;
        }

        .section-header h2 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .section-header p {
            font-size: 1.15rem;
            color: var(--text-muted);
        }

        .use-case-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 32px;
        }

        .use-case-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 36px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: all 0.3s ease;
        }

        .use-case-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .use-case-tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0 auto 16px;
        }

        .tag-compta { background-color: #fef3c7; color: #92400e; }
        .tag-rh { background-color: #fce7f3; color: #9d174d; }
        .tag-commerce { background-color: #e0e7ff; color: #1e3a8a; }

        .use-case-card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
        }

        .use-case-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .metric-box {
            background-color: var(--accent-green-light);
            border: 1px solid rgba(5, 150, 105, 0.2);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            color: #065f46;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Pricing Section */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            align-items: stretch;
        }

        .price-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .price-card.featured {
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .price-badge {
            position: absolute;
            top: -16px;
            right: 24px;
            background-color: var(--primary);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .price-header h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .price-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .price-amount {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 24px;
        }

        .price-amount span {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .price-features {
            list-style: none;
            margin-bottom: 32px;
        }

        .price-features li {
            padding-left: 24px;
            position: relative;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .price-features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Process Section */
        .process-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .process-step {
            background-color: var(--white);
            padding: 32px 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            text-align: center;
        }

        .step-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            opacity: 0.35;
            margin-bottom: 8px;
        }

        .process-step h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        /* Guarantee / Philosophy */
        .about-box {
            background: var(--dark);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 64px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .about-box h2 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .about-quote {
            font-size: 1.25rem;
            font-style: italic;
            border-left: 4px solid var(--accent-green);
            padding-left: 20px;
            margin-bottom: 24px;
            color: #cbd5e1;
        }

        .about-box p {
            color: #94a3b8;
            margin-bottom: 16px;
        }

        /* Call to Action */
        .cta-box {
            text-align: center;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            color: var(--white);
            border-radius: var(--radius-lg);
            padding: 64px 32px;
            box-shadow: var(--shadow-lg);
        }

        .cta-box h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .cta-box p {
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto 32px;
            opacity: 0.95;
        }

        .cta-box .btn-cta {
            background-color: var(--white);
            color: var(--primary) !important;
            font-size: 1.05rem;
            padding: 16px 36px;
        }

        .cta-box .btn-cta:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background-color: var(--white);
            border-top: 1px solid var(--border);
            padding: 64px 0 32px;
            margin-top: 64px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 48px;
            margin-bottom: 48px;
        }

        .footer-brand p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 16px;
            max-width: 320px;
        }

        .footer-column h4 {
            font-size: 1rem;
            font-weight: 700;
            color:
