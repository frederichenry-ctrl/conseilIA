<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FH Consulting | Performance Opérationnelle & Conseil IA pour PME</title>
    <meta name="description" content="Conseil et intégration d'IA pour PME & TPE. Libérez vos équipes des tâches rébarbatives sur la Compta, les RH et la Vente pour booster votre rentabilité.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --primary-light: #eff6ff;
            --accent: #0284c7;
            --accent-green: #059669;
            --accent-green-light: #ecfdf5;
            --dark: #0f172a;
            --dark-surface: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius-md: 8px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header / Navigation */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand-logo svg {
            width: 44px;
            height: 44px;
        }

        .brand-text {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.03em;
        }

        .brand-text span {
            color: var(--accent);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white) !important;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--dark);
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: var(--bg-light);
            border-color: #94a3b8;
        }

        /* Hero Section */
        .hero {
            padding: 96px 0 64px;
            text-align: center;
            background: radial-gradient(100% 100% at 50% 0%, rgba(30, 58, 138, 0.06) 0%, rgba(248, 250, 252, 0) 100%);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background-color: var(--primary-light);
            color: var(--primary);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 24px;
            border: 1px solid rgba(30, 58, 138, 0.15);
        }

        .hero h1 {
            font-size: 3.25rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.15;
            max-width: 940px;
            margin: 0 auto 24px;
            letter-spacing: -0.025em;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 760px;
            margin: 0 auto 40px;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Strategic Stats Bar */
        .stats-bar {
            margin-top: 64px;
            padding: 32px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            box-shadow: var(--shadow-sm);
        }

        .stat-item h3 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .stat-item p {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 700;
            margin-top: 4px;
        }

        .stat-item span {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            font-weight: 500;
        }
